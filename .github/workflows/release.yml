name: Semantic Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Semantic Release
        uses: go-semantic-release/action@v1
        with:
          provider: github
          changelog: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
