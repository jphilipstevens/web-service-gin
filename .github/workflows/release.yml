name: Semantic Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download go-semantic-release
        run: |
          wget https://github.com/go-semantic-release/semantic-release/releases/latest/download/semantic-release_linux_amd64.tar.gz
          tar -xzf semantic-release_linux_amd64.tar.gz
          chmod +x semantic-release

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./semantic-release -provider github -changelog
