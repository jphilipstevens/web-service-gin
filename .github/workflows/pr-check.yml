name: PR Checks

on:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "The following files need formatting:" && echo "$unformatted"
            exit 1
          fi
          go fmt ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo "Running go fmt changed files. Please run 'go fmt ./...' locally and commit the result."
            git diff --color
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
